name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: vet & test
        working-directory: src
        run: |
          go vet ./...
          go test ./...

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            output: ArteCraft-Linux-x86_64
          - os: windows-latest
            goos: windows
            goarch: amd64
            output: ArteCraft.exe
          - os: macos-latest
            goos: darwin
            goarch: arm64
            output: ArteCraft-macOS-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: build
        working-directory: src
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags "-s -w" -o ${{ matrix.output }} .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: src/${{ matrix.output }}
