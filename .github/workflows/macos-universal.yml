name: macos-universal

# Builds the macOS version of ArteCraft on a real Apple runner (universal: arm64 + x86_64),
# bundles ArteCraft.app, signs it ad-hoc and attaches the zip to an existing release.
# Why CI: WKWebView needs cgo, and cgo for darwin cannot be cross-compiled from Linux.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach the build to"
        required: true
        default: "v2.5.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Read version
        id: ver
        run: |
          V=$(grep -oE 'LauncherVersion = "([0-9]+\.[0-9]+\.[0-9]+)"' src/main.go | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          [ -n "$V" ] || { echo "cannot read LauncherVersion"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "version is $V"

      - name: Test and build universal binary
        working-directory: src
        env:
          CGO_ENABLED: "1"
        run: |
          go vet ./...
          go test ./...
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o /tmp/ArteCraft-arm64 .
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o /tmp/ArteCraft-amd64 .
          lipo -create -output /tmp/ArteCraft /tmp/ArteCraft-arm64 /tmp/ArteCraft-amd64
          file /tmp/ArteCraft
          /tmp/ArteCraft --version
          /tmp/ArteCraft --self-test

      - name: Bundle ArteCraft.app
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          APP="ArteCraft.app"
          rm -rf "$APP" ArteCraft-macOS-Universal.zip
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp /tmp/ArteCraft "$APP/Contents/MacOS/ArteCraft"
          chmod 755 "$APP/Contents/MacOS/ArteCraft"

          # icon: png -> icns
          ICONSET=$(mktemp -d)/AppIcon.iconset
          mkdir -p "$ICONSET"
          SRC_ICON=$(ls icon/artecraft-1024.png icon/artecraft-512.png 2>/dev/null | head -1)
          for s in 16 32 64 128 256 512; do
            sips -z $s $s "$SRC_ICON" --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
            d=$((s*2))
            sips -z $d $d "$SRC_ICON" --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/AppIcon.icns"

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDisplayName</key><string>ArteCraft</string>
            <key>CFBundleName</key><string>ArteCraft</string>
            <key>CFBundleExecutable</key><string>ArteCraft</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundleIdentifier</key><string>com.getartecraft.launcher</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSAppTransportSecurity</key><dict><key>NSAllowsLocalNetworking</key><true/></dict>
          </dict>
          </plist>
          PLIST

          # ad-hoc signature: unsigned apps are blocked by Gatekeeper on first launch
          codesign --force --deep --sign - "$APP" || echo "ad-hoc signing failed, continuing"
          codesign --verify --deep --strict "$APP" || true
          plutil -p "$APP/Contents/Info.plist" | grep -E "CFBundleShortVersionString|LSMinimumSystemVersion"

          cat > "Open ArteCraft (First Run).command" <<'CMD'
          #!/bin/bash
          cd "$(dirname "$0")"
          xattr -dr com.apple.quarantine ArteCraft.app 2>/dev/null
          open ArteCraft.app
          CMD
          chmod +x "Open ArteCraft (First Run).command"

          zip -qry ArteCraft-macOS-Universal.zip ArteCraft.app "Open ArteCraft (First Run).command"
          shasum -a 256 ArteCraft-macOS-Universal.zip | tee ArteCraft-macOS-Universal.sha256
          ls -la ArteCraft-macOS-Universal.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ArteCraft-macOS-Universal
          path: |
            ArteCraft-macOS-Universal.zip
            ArteCraft-macOS-Universal.sha256

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          echo "attaching to $TAG"
          gh release view "$TAG" >/dev/null || { echo "release $TAG not found"; exit 1; }
          gh release upload "$TAG" ArteCraft-macOS-Universal.zip --clobber
          gh release view "$TAG" --json assets -q '.assets[] | "\(.name)  \(.size) bytes  \(.url)"'
