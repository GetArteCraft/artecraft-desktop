name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Please fill in the fields below — without them it is hard to reproduce the problem.
  - type: input
    id: version
    attributes:
      label: ArteCraft version
      description: Shown at the bottom of the window, e.g. 2.5.0
      placeholder: 2.5.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Linux
        - macOS
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Marketplace tab
        2. Press Install on an entry
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the error text you see, and a screenshot if possible
    validations:
      required: true
