name: Suggest an application
description: Ask for an open-source program to be added to the catalog
labels: [catalog]
body:
  - type: input
    id: repo
    attributes:
      label: GitHub repository
      description: Link or owner/name
      placeholder: https://github.com/owner/name
    validations:
      required: true
  - type: input
    id: replaces
    attributes:
      label: What does it replace
      placeholder: Adobe Photoshop
  - type: dropdown
    id: os
    attributes:
      label: Platforms with ready builds
      multiple: true
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it belongs in the catalog
      description: Licence, activity, quality, what makes it useful
    validations:
      required: true
