<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArteCraft</title>
<link rel="icon" type="image/png" href="favicon.png" sizes="96x96">
<link rel="apple-touch-icon" href="logo.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="backdrop"><div class="grid-lines"></div></div>

<div class="app">
  <aside class="rail" id="rail">
    <div class="brand">
      <!-- иконка приложения = лого сайта getartecraft.com -->
      <div class="brand-mark" aria-hidden="true"><img src="logo.png" alt="ArteCraft"></div>
      <div>
        <div class="brand-name">ArteCraft</div>
        <div class="brand-sub" id="brandSub">Desktop Hub</div>
      </div>
    </div>

    <nav class="nav" id="nav">
      <div class="nav-label" data-i18n="nav.workspace">Workspace</div>
      <button class="nav-item" data-nav="discover"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3l2.4 5.6L20 11l-5.6 2.4L12 19l-2.4-5.6L4 11l5.6-2.4z"/></svg><span data-i18n="nav.discover">Discover</span></button>
      <button class="nav-item" data-nav="apps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg><span data-i18n="nav.apps">All apps</span><span class="count" id="cntApps">13</span></button>
      <button class="nav-item" data-nav="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span data-i18n="nav.library">Library</span><span class="count" id="cntLib">0</span></button>
      <button class="nav-item" data-nav="market"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 9l2-5h14l2 5"/><path d="M5 9v10h14V9"/><path d="M9 19v-6h6v6"/></svg><span data-i18n="nav.market">Marketplace</span></button>
      <button class="nav-item" data-nav="downloads"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg><span data-i18n="nav.downloads">Downloads</span><span class="count" id="cntDl">0</span></button>
      <div class="nav-label" data-i18n="nav.system">System</div>
      <button class="nav-item" data-nav="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg><span data-i18n="nav.settings">Settings</span></button>
    </nav>

    <div class="rail-foot">
      <div class="account" id="accountChip">
        <div class="avatar" id="accAvatar">?</div>
        <div class="meta"><b id="accName">Guest</b><span id="accMail"></span></div>
      </div>
      <div style="display:flex;align-items:center;gap:7px;padding:2px 6px;color:var(--t4);font-size:11px;font-family:var(--mono)">
        <span class="pulse"></span><span id="footStatus">…</span>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div style="min-width:0">
        <h1 class="page-title" id="pageTitle">Discover</h1>
        <div class="page-sub" id="pageSub"></div>
      </div>
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="opacity:.6"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="searchInput" data-i18n="search.placeholder" data-i18n-attr="placeholder" placeholder="Search: Photoshop, PSD, obs, blender…" autocomplete="off" />
        <span class="kbd">Ctrl K</span>
      </div>
      <button class="icon-btn" id="langBtn" title="Language">
        <span id="langFlag" class="lang-badge">EN</span>
        <span id="langName" style="font-size:11px;max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">English</span>
      </button>
      <button class="icon-btn" id="btnImport" title="Import from GitHub">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 21h16"/></svg>
      </button>
      <button class="icon-btn" id="btnTheme" title="Theme">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg>
      </button>
    </header>
    <div class="view" id="view"></div>
  </main>
</div>

<div class="toasts" id="toasts"></div>
<div id="modalRoot"></div>

<script src="i18n.js"></script>
<script src="seeddesc.js"></script>
<script src="app.js"></script>
</body>
</html>
